<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="540" viewBox="0 0 1160 540" role="img" font-family="Helvetica, Arial, sans-serif" aria-label="El navegador pide un plan, sube a audiovisual-staging y llama a finalize; el backend obtiene un token de app en Entra y crea un job en MIA vía APIM; MIA guarda el job en mia-jobs y el worker Go lo toma, copia a audiovisual y borra staging. Con el flag apagado el navegador sube directo a audiovisual.">
  <rect width="1160" height="540" fill="#f6f7f9"/>
      <defs>
        <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f6feb"/></marker>
        <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d6878"/></marker>
      </defs>
      <g fill="#ffffff" stroke="#c9cfd8" stroke-width="1.2">
        <rect x="30" y="50" width="190" height="150" rx="8"/>
        <rect x="320" y="50" width="220" height="150" rx="8"/>
        <rect x="680" y="40" width="190" height="50" rx="8"/>
        <rect x="680" y="125" width="190" height="85" rx="8"/>
        <rect x="960" y="125" width="170" height="85" rx="8"/>
        <rect x="680" y="245" width="190" height="55" rx="8"/>
        <rect x="30" y="370" width="1110" height="150" rx="10" fill="none" stroke-dasharray="2 4"/>
        <rect x="50" y="400" width="410" height="100" rx="8"/>
        <rect x="640" y="400" width="480" height="100" rx="8" fill="#e6efff" stroke="#1f6feb"/>
      </g>
      <g fill="#1b2230" font-size="13">
        <text x="125" y="78" text-anchor="middle" font-weight="600">Navegador</text>
        <text x="125" y="98" text-anchor="middle" font-size="11.5" fill="#5d6878">UploadPage · LocalSource</text>

        <text x="430" y="78" text-anchor="middle" font-weight="600">Azure Functions (SWA)</text>
        <text x="340" y="100" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">/upload/local/plan</text>
        <text x="340" y="170" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">/upload/local/finalize</text>
        <text x="340" y="120" font-size="11" fill="#5d6878">guarda plans/{batchId}.json</text>
        <text x="340" y="188" font-size="11" fill="#5d6878">arma el job desde el plan</text>

        <text x="775" y="62" text-anchor="middle" font-weight="600">Entra ID</text>
        <text x="775" y="80" text-anchor="middle" font-size="11" fill="#5d6878">app: visor-audiovisual</text>

        <text x="775" y="148" text-anchor="middle" font-weight="600">APIM → MIA API</text>
        <text x="775" y="167" text-anchor="middle" font-size="11" fill="#5d6878">rol Media.Jobs.Write</text>
        <text x="775" y="183" text-anchor="middle" font-size="11" fill="#5d6878">allowlist de contenedores</text>
        <text x="775" y="199" text-anchor="middle" font-size="11" fill="#5d6878">no llama al worker</text>
        <text x="775" y="268" text-anchor="middle" font-weight="600">contenedor mia-jobs</text>
        <text x="775" y="287" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#5d6878">jobs/{id}.json · queued</text>

        <text x="1045" y="155" text-anchor="middle" font-weight="600">Worker de transferencia</text>
        <text x="1045" y="174" text-anchor="middle" font-size="11" fill="#5d6878">Go · Container App</text>
        <text x="1045" y="190" text-anchor="middle" font-size="11" fill="#5d6878">pry-mia-media-transfer</text>

        <text x="46" y="390" font-size="11" fill="#5d6878" letter-spacing=".06em">CUENTA DE ALMACENAMIENTO · ripconaudiovisual</text>
        <text x="70" y="430" font-weight="600">audiovisual-staging</text>
        <text x="70" y="452" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#5d6878">staging/{batchId}/00001-clip.mp4</text>
        <text x="70" y="478" font-size="11" fill="#5d6878">temporal · no aparece en la galería</text>
        <text x="660" y="430" font-weight="600">audiovisual</text>
        <text x="660" y="452" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#5d6878">{code}_{project}/{subfolder}/clip.mp4</text>
        <text x="660" y="478" font-size="11" fill="#5d6878">destino final · lo que lee la galería</text>
      </g>
      <g stroke="#1f6feb" stroke-width="1.6" fill="none" marker-end="url(#a)">
        <line x1="220" y1="100" x2="318" y2="100"/>
        <line x1="80" y1="200" x2="80" y2="398"/>
        <line x1="220" y1="165" x2="318" y2="165"/>
        <line x1="540" y1="65" x2="678" y2="65"/>
        <line x1="540" y1="160" x2="678" y2="160"/>
        <line x1="775" y1="210" x2="775" y2="243"/>
        <line x1="1000" y1="210" x2="1000" y2="272"/>
        <line x1="1000" y1="272" x2="872" y2="272"/>
        <line x1="1045" y1="210" x2="1045" y2="398"/>
        <line x1="460" y1="450" x2="638" y2="450"/>
      </g>
      <g stroke="#5d6878" stroke-width="1.2" fill="none" marker-end="url(#m)">
        <line x1="318" y1="118" x2="222" y2="118"/>
        <line x1="678" y1="185" x2="542" y2="185"/>
      </g>
      <polyline points="190,200 190,340 760,340 760,398" fill="none" stroke="#5d6878" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#m)"/>
      <g font-size="11.5" fill="#1b2230">
        <text x="269" y="93" text-anchor="middle">① plan</text>
        <text x="269" y="133" text-anchor="middle" fill="#5d6878">batchId + SAS</text>
        <text x="90" y="272">② PUT bloques</text>
        <text x="90" y="287">32 MB vía SAS</text>
        <text x="269" y="158" text-anchor="middle">③ finalize</text>
        <text x="269" y="183" text-anchor="middle" fill="#5d6878">solo batchId</text>
        <text x="609" y="57" text-anchor="middle">④ token de app</text>
        <text x="609" y="152" text-anchor="middle">⑤ POST /files/jobs</text>
        <text x="609" y="200" text-anchor="middle" fill="#5d6878">202 · jobId</text>
        <text x="785" y="232">escribe job</text>
        <text x="936" y="264" text-anchor="middle">⑥ revisa c/15 s</text>
        <text x="936" y="290" text-anchor="middle" fill="#5d6878">toma el job</text>
        <text x="1055" y="335">⑦ copia y</text>
        <text x="1055" y="350">borra staging</text>
        <text x="549" y="442" text-anchor="middle" fill="#1f6feb">lo mueve el worker</text>
        <text x="475" y="332" text-anchor="middle" fill="#5d6878">flag apagado (prod hoy): la SAS apunta directo al contenedor final</text>
      </g>
    </svg>